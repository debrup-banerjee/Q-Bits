# Local dependencies for Q-Bits. Start with: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qbits
      POSTGRES_USER: qbits
      POSTGRES_PASSWORD: qbits
    ports:
      - "5432:5432"
    volumes:
      - qbits-pg:/var/lib/postgresql/data
volumes:
  qbits-pg:
