# nginx site for Q-Bits, installed by deploy-app.sh to /etc/nginx/sites-available/qbits on every
# deploy (spec 007 R8). Cloudflare terminates HTTPS; this origin serves plain HTTP on port 80.
#
# Pages (/, /story/..., /section/..., robots.txt, sitemaps, unknown paths) go to the backend, which
# fills in each page's first response. Built JS/CSS and the favicon are served straight from
# web/dist. If the backend is down, the plain built index.html is served so the app still loads.

server {
  listen 80;
  server_name www.qbitsnews.com;
  return 301 https://qbitsnews.com$request_uri;
}

server {
  listen 80 default_server;
  server_name _;

  root /opt/qbits/app/web/dist;

  location /api/ {
    proxy_pass http://127.0.0.1:8080;
    include snippets/qbits-proxy.conf;
  }

  # Hashed file names from the Vite build never change content, so they can be cached for good.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /favicon.svg {
    try_files $uri =404;
  }

  # Not public: health details and the API document stay private, as before this config.
  location /actuator {
    return 404;
  }

  location /v3/ {
    return 404;
  }

  location / {
    proxy_pass http://127.0.0.1:8080;
    include snippets/qbits-proxy.conf;
    # Only these codes are replaced; the backend's own 404 pages pass through unchanged.
    proxy_intercept_errors on;
    error_page 502 503 504 =503 @shell;
  }

  location @shell {
    try_files /index.html =503;
    add_header Cache-Control "no-store" always;
  }
}
