# Approved sources for Q-Bits.
#
# STATUS: all 24 sources approved by the owner on 2026-10-03 and enabled.
# Still to do before the first real run, per source:
#   1. confirm feedUrl is a working RSS/Atom feed (URLs are best-known and not yet tested; some may have moved),
#   2. read the publisher's feed/RSS terms and fill termsUrl,
#   3. set termsReviewedOn to the review date (YYYY-MM-DD).
# The app refuses to start while an enabled source lacks termsUrl or termsReviewedOn (spec 001, R1.4).
# To start without a source, set it to enabled: false.
#
# Note on terms: many publishers allow feed use only with attribution and/or for non-commercial use.
# That fits the current personal/team use. Re-review every source before any public or paid launch.
#
# Fields
#   aiNative:     true if the feed covers only AI (skips the keyword pre-filter)
#   region:       global | india   (a hint for the India AI section, not a rule)
#   sectionHint:  optional default section; the summary step can override it
#
# Deliberately not listed: Reuters, Bloomberg, Financial Times, Wall Street Journal, The Information
# (no public RSS, paywalled, or terms that forbid aggregation). Revisit only through a licensed API.

