spring:
  application:
    name: qbits
  datasource:
    url: ${QBITS_DB_URL:jdbc:postgresql://localhost:5432/qbits}
    username: ${QBITS_DB_USER:qbits}
    password: ${QBITS_DB_PASSWORD:qbits}
  threads:
    virtual:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

qbits:
  sources-file: ${QBITS_SOURCES_FILE:../config/sources.yml}
  contact-email: debrup28.nitdgp@gmail.com
  web:
    allowed-origins: ${QBITS_WEB_ORIGINS:http://localhost:5173}
  ingestion:
    tick: PT5M
    default-interval: PT30M
    min-interval: PT15M
    timeout: PT10S
    retries: 2
    retry-backoff: PT2S
    max-age: PT72H
    retention: P7D
    retention-cron: "0 15 2 * * *"
    robots-cache-ttl: PT24H
    degraded-after-failures: 5
    robots-agent-name: QBits
    user-agent: "QBits/0.1 (+mailto:debrup28.nitdgp@gmail.com)"
  story-writer:
    provider: anthropic
    model: ${QBITS_STORY_MODEL:}
    prompt-version: v1
    max-output-tokens: 800
    daily-call-cap: 500
    parallelism: 4
    batch-size: 20
    timeout: PT30S
    tick: PT2M
    max-backoff: PT30M
  relevance:
    threshold: 1.0
    keywords:
      - { term: "artificial intelligence", weight: 1.0 }
      - { term: "AI", weight: 0.6 }
      - { term: "A.I.", weight: 0.6 }
      - { term: "machine learning", weight: 1.0 }
      - { term: "deep learning", weight: 1.0 }
      - { term: "neural network", weight: 1.0 }
      - { term: "large language model", weight: 1.0 }
      - { term: "language model", weight: 0.8 }
      - { term: "LLM", weight: 1.0 }
      - { term: "LLMs", weight: 1.0 }
      - { term: "generative", weight: 0.6 }
      - { term: "chatbot", weight: 0.6 }
      - { term: "ChatGPT", weight: 1.0 }
      - { term: "GPT", weight: 0.8 }
      - { term: "OpenAI", weight: 1.0 }
      - { term: "Anthropic", weight: 1.0 }
      - { term: "Claude", weight: 0.6 }
      - { term: "DeepMind", weight: 1.0 }
      - { term: "Gemini", weight: 0.6 }
      - { term: "Copilot", weight: 0.6 }
      - { term: "Hugging Face", weight: 1.0 }
      - { term: "Mistral", weight: 0.6 }
      - { term: "Llama", weight: 0.4 }
      - { term: "NVIDIA", weight: 0.5 }
      - { term: "GPU", weight: 0.5 }
      - { term: "GPUs", weight: 0.5 }
      - { term: "semiconductor", weight: 0.5 }
      - { term: "chip", weight: 0.3 }
      - { term: "chips", weight: 0.3 }
      - { term: "data centre", weight: 0.4 }
      - { term: "data center", weight: 0.4 }
      - { term: "robotics", weight: 0.5 }
      - { term: "autonomous", weight: 0.4 }
      - { term: "computer vision", weight: 1.0 }
      - { term: "IndiaAI", weight: 1.0 }
      - { term: "deepfake", weight: 1.0 }
      - { term: "AGI", weight: 1.0 }
