# Approved sources for Q-Bits.
#
# STATUS: 26 sources, 25 enabled (owner approved the original 24 on 2026-10-03; sarvam-ai-blog
# and pcquest added and pib-meity disabled on 2026-10-04 -- see each entry's own notes).
# termsUrl and termsReviewedOn set on 2026-10-04 at the owner's request (his attestation).
# Each termsUrl is the publisher's general site terms page. Confirmed to exist by search on 2026-10-04,
# except these, which are best-known links still to be opened once: microsoft, the-verge, wired, ars-technica,
# bbc, guardian, et-tech, mint, the-hindu.
# Still to do: confirm each feedUrl is a working RSS/Atom feed (best-known, not yet fetched; some may have moved).
# sarvam-ai-blog and pcquest are the exception: their feeds were actually fetched and confirmed live
# on 2026-10-04, not just best-known links.
# The app refuses to start while an enabled source lacks termsUrl or termsReviewedOn (spec 001, R1.4).
# To start without a source, set it to enabled: false.
#
# Note on terms: many publishers allow feed use only with attribution and/or for non-commercial use.
# That fits the current personal/team use. Re-review every source before any public or paid launch.
#
# Fields
#   aiNative:     true if the feed covers only AI (skips the keyword pre-filter)
#   region:       global | india   (a hint for the India AI section, not a rule)
#   sectionHint:  optional default section; the summary step can override it
#   intervalMinutes: optional fetch interval override, 15 or more (default 30)
#   official:     optional, true for the organisation's own channel (company, lab, university,
#                 government). When several sources report the same event, an official one is
#                 published and the others held back (spec 008). Default false.
#
# Deliberately not listed: Reuters, Bloomberg, Financial Times, Wall Street Journal, The Information
# (no public RSS, paywalled, or terms that forbid aggregation). Revisit only through a licensed API.
# Also not listed: Meta's AI blog (ai.meta.com/blog) -- checked 2026-10-04, it has no official RSS
# feed (confirmed: no feed link in the page, no Meta-operated endpoint). Only unofficial
# third-party scrapers exist; same reasoning as above applies. Meta AI news still surfaces via
# TechCrunch, The Verge, the Guardian etc. when they cover it.

